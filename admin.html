<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Admin · Al Kamil</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F2B2F;--pri:#266870;--soft:#90C5C4;--sun:#FFC94D;--red:#E5484D;--mint:#F1FFFC;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--mint);color:var(--ink);font:600 16px/1.5 Quicksand,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:Grandstander,sans-serif;margin:0;color:var(--pri)}[hidden]{display:none!important}
.gate{min-height:100svh;display:grid;place-items:center;padding:20px}
.box{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink);padding:28px;width:min(420px,100%);text-align:center}
.box img{height:84px;margin-bottom:10px}.box p{margin:6px 0 16px}
input,textarea{width:100%;font:600 16px Quicksand,sans-serif;padding:10px 12px;border:2px solid var(--soft);border-radius:12px;color:var(--ink);background:#fff}
input:focus,textarea:focus{outline:3px solid var(--sun);border-color:var(--ink)}textarea{min-height:76px;resize:vertical}
button{font:800 16px Grandstander,sans-serif;cursor:pointer}
.btn{background:var(--sun);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:999px;padding:10px 24px;transition:translate .15s,box-shadow .15s}
.btn:hover{translate:0 -2px;box-shadow:0 6px 0 var(--ink)}.btn:active{translate:0 3px;box-shadow:0 1px 0 var(--ink)}.btn:disabled{opacity:.6;cursor:wait}
.btn.t{background:var(--pri);color:#fff}
.x{border:2px solid var(--red);color:var(--red);background:#fff;border-radius:10px;padding:6px 12px;font-size:14px}
.ghost{border:2px solid var(--soft);color:var(--pri);background:#fff;border-radius:10px;padding:6px 12px;font-size:14px}
.err{color:var(--red);min-height:22px;margin-top:10px;font-size:14px}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid var(--ink);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar img{height:44px}.bar .sp{flex:1}.bar #sm{font-size:14px}
main{max-width:900px;margin:0 auto;padding:20px 16px 80px}
details{background:#fff;border:3px solid var(--ink);border-radius:18px;margin:14px 0;padding:6px 16px 14px;box-shadow:0 4px 0 var(--ink)}
summary{font:800 19px Grandstander,sans-serif;color:var(--pri);cursor:pointer;padding:10px 0}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px;color:var(--pri)}
.row{display:flex;gap:10px;align-items:center;margin:10px 0}.row>input{flex:1}
.item{border:2px solid var(--soft);border-radius:14px;padding:10px;margin:10px 0;display:flex;gap:12px;align-items:flex-start}
.item .f{flex:1;min-width:0}.thumb{width:84px;height:84px;border-radius:10px;border:2px solid var(--ink);object-fit:cover;background:var(--soft);flex:none;display:grid;place-items:center;font-size:12px}
.col{display:flex;flex-direction:column;gap:6px}.meta{font-size:12px;color:var(--pri);margin-top:4px}
.note{font-size:14px;color:var(--pri);margin:4px 0 8px}
</style>
</head>
<body>

<section class="gate" id="gate"><form class="box" id="gf" autocomplete="off">
<img src="logo.svg" alt="Al-Kamil">
<h1>Area Admin</h1><p>Masukkan kode akses untuk mengedit website.</p>
<input type="password" id="code" placeholder="Kode akses" autocomplete="off" required>
<div class="err" id="ge"></div>
<button class="btn" id="gb" type="submit">Masuk</button>
</form></section>

<div id="app" hidden>
<div class="bar"><img src="logo.svg" alt=""><h3>Panel Admin</h3><span class="sp"></span><span id="sm"></span>
<button class="ghost" id="out" type="button">Keluar</button><button class="btn" id="sv" type="button">Simpan</button></div>
<main id="panel"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script>
(function(){
var $=function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s))},$1=function(s,c){return (c||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
var CODE='',S={fields:[],texts:{},ts:[],cfg:{},gal:[]};
try{CODE=sessionStorage.getItem('ak_code')||''}catch(e){}

/* ---------- gate ---------- */
$1('#gf').addEventListener('submit',function(e){e.preventDefault();var c=$1('#code').value.trim(),b=$1('#gb'),er=$1('#ge');if(!c)return;
 b.disabled=true;er.textContent='Memeriksa...';
 AK.callAdmin({action:'verify',code:c}).then(function(){CODE=c;try{sessionStorage.setItem('ak_code',c)}catch(x){}enter()})
 .catch(function(x){er.textContent=x.status===401||x.status===403?'Kode salah.':(x.message||'Gagal terhubung.')}).then(function(){b.disabled=false})});
$1('#out').onclick=function(){try{sessionStorage.removeItem('ak_code')}catch(e){}location.reload()};
if(CODE){AK.callAdmin({action:'verify',code:CODE}).then(enter).catch(function(){CODE='';try{sessionStorage.removeItem('ak_code')}catch(e){}})}

/* ---------- load ---------- */
function enter(){
 $1('#gate').hidden=true;$1('#app').hidden=false;$1('#panel').innerHTML='<p>Memuat data...</p>';
 Promise.all([AK.fetchContent(),fetch('index.html').then(function(r){return r.text()})]).then(function(r){
  var d=r[0],doc=new DOMParser().parseFromString(r[1],'text/html'),seen={};
  S.fields=[];
  $('[data-t][data-l]',doc).forEach(function(el){var k=el.dataset.t;if(seen[k])return;seen[k]=1;
   var g=(el.closest('[data-gl]')||{dataset:{gl:'Umum'}}).dataset.gl;S.fields.push({k:k,l:el.dataset.l,g:g,def:el.textContent.trim()})});
  S.texts=d.texts||{};S.ts=JSON.parse(JSON.stringify(d.ts));S.cfg=d.cfg;
  S.gal=d.gal.filter(function(g){return g.image}).map(function(g){return{caption:g.caption||'',image:g.image}});
  build()});
}

/* ---------- ui ---------- */
function build(){
 var G={};S.fields.forEach(function(f){(G[f.g]=G[f.g]||[]).push(f)});
 var h='';
 h+='<details open><summary>Galeri Kegiatan (foto)</summary><p class="note">Foto otomatis dikecilkan dan disimpan sebagai teks agar database tetap ringan.</p><div id="gl"></div><div class="row"><button class="btn t" id="addp" type="button">Tambah Foto</button><input type="file" id="fi" accept="image/*" multiple hidden><span class="meta" id="gtot"></span></div></details>';
 h+='<details><summary>Cerita Orang Tua (bagian gulir)</summary><div id="tsl"></div><button class="btn t" id="addt" type="button">Tambah Cerita</button></details>';
 Object.keys(G).forEach(function(g){h+='<details><summary>'+esc(g)+'</summary>'+G[g].map(function(f){
  var v=S.texts[f.k]!=null?S.texts[f.k]:f.def;
  return '<label>'+esc(f.l)+'</label>'+(v.length>55?'<textarea data-k="'+f.k+'">'+esc(v)+'</textarea>':'<input data-k="'+f.k+'" value="'+esc(v)+'">')}).join('')+'</details>'});
 h+='<details><summary>Pengaturan</summary><label>Nomor WhatsApp (format 628xxxxxxxxxx)</label><input data-c="wa" value="'+esc(S.cfg.wa)+'"><label>Link Google Maps</label><input data-c="map" value="'+esc(S.cfg.map)+'"></details>';
 $1('#panel').innerHTML=h;lists();
}
function kb(s){return Math.round(s.length*.75/1024)}
function lists(){
 $1('#gl').innerHTML=S.gal.map(function(g,i){return '<div class="item"><img class="thumb" src="'+esc(g.image)+'" alt=""><div class="f"><input data-gc="'+i+'" value="'+esc(g.caption)+'" placeholder="Keterangan foto"><div class="meta">~'+kb(g.image)+' KB</div></div><div class="col"><button class="ghost" data-gu="'+i+'" type="button">↑</button><button class="ghost" data-gdn="'+i+'" type="button">↓</button><button class="x" data-gd="'+i+'" type="button">Hapus</button></div></div>'}).join('')||'<p class="note">Belum ada foto. Website menampilkan placeholder.</p>';
 var tot=S.gal.reduce(function(a,g){return a+kb(g.image)},0);$1('#gtot').textContent=S.gal.length?S.gal.length+' foto · ~'+tot+' KB':'';
 $1('#tsl').innerHTML=S.ts.map(function(t,i){return '<div class="item"><div class="f"><textarea data-tq="'+i+'">'+esc(t.q)+'</textarea><input data-tn="'+i+'" value="'+esc(t.n)+'" placeholder="Nama" style="margin-top:6px"></div><button class="x" data-td="'+i+'" type="button">Hapus</button></div>'}).join('');
}
function msg(t,bad){var m=$1('#sm');m.textContent=t;m.style.color=bad?'#E5484D':'#266870'}

$1('#panel').addEventListener('input',function(e){var t=e.target,d=t.dataset;
 if(d.k!==undefined)S.texts[d.k]=t.value;else if(d.gc)S.gal[+d.gc].caption=t.value;else if(d.tq)S.ts[+d.tq].q=t.value;else if(d.tn)S.ts[+d.tn].n=t.value;else if(d.c)S.cfg[d.c]=t.value});
$1('#panel').addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;var d=t.dataset,i;
 function mv(a,b){if(b<0||b>=S.gal.length)return;var x=S.gal[a];S.gal[a]=S.gal[b];S.gal[b]=x;lists()}
 if(d.gd!==undefined){S.gal.splice(+d.gd,1);lists()}else if(d.gu!==undefined)mv(+d.gu,+d.gu-1);else if(d.gdn!==undefined)mv(+d.gdn,+d.gdn+1);
 else if(d.td!==undefined){S.ts.splice(+d.td,1);lists()}else if(t.id==='addt'){S.ts.push({q:'',n:''});lists()}else if(t.id==='addp'){$1('#fi').click()}});

/* ---------- image -> compressed base64 string ---------- */
function toData(file){return new Promise(function(res,rej){
 var u=URL.createObjectURL(file),im=new Image();
 im.onload=function(){var M=900,r=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  var o=c.toDataURL('image/webp',.72);if(o.indexOf('data:image/webp')!==0)o=c.toDataURL('image/jpeg',.72);res(o)};
 im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('File bukan gambar yang valid'))};im.src=u})}
document.addEventListener('change',async function(e){if(e.target.id!=='fi')return;var fs=Array.from(e.target.files);
 for(var f of fs){if(!/^image\//.test(f.type)){msg('Hanya file gambar yang didukung.',1);continue}
  try{msg('Memproses '+f.name+'...');S.gal.push({caption:'',image:await toData(f)})}catch(x){msg(x.message,1)}}
 e.target.value='';lists();msg('Foto ditambahkan. Klik Simpan.')});

/* ---------- save ---------- */
$1('#sv').onclick=function(){var b=this;b.disabled=true;msg('Menyimpan...');
 var texts={};S.fields.forEach(function(f){if(S.texts[f.k]!=null&&S.texts[f.k]!==f.def)texts[f.k]=S.texts[f.k]});
 var ts=S.ts.filter(function(t){return t.q.trim()||t.n.trim()});
 AK.callAdmin({action:'save',code:CODE,content:{texts:texts,ts:ts,cfg:S.cfg},gallery:S.gal.map(function(g){return{caption:g.caption,image:g.image}})})
 .then(function(){msg('Tersimpan. Website sudah diperbarui.')})
 .catch(function(x){msg('Gagal: '+(x.status===401||x.status===403?'kode tidak valid':x.message),1)}).then(function(){b.disabled=false})};
})();
</script>
</body>
</html>
